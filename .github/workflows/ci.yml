name: selftest

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: [ "3.9", "3.12" ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependency (openpyxl only)
        # 不安装 pymiere：CI 里没有 Premiere，基础自测本就不依赖它
        run: python -m pip install --upgrade pip openpyxl

      - name: Reject Adobe proprietary files
        shell: bash
        run: |
          if find . -name 'CSInterface.js' -not -path './.git/*' | grep -q .; then
            echo "::error::CSInterface.js is Adobe proprietary and must not be committed"
            exit 1
          fi
          if grep -rIl 'ADOBE SYSTEMS INCORPORATED' --exclude-dir=.git . ; then
            echo "::error::found Adobe copyright header in repository"
            exit 1
          fi
          echo "no Adobe proprietary files found"

      - name: Run self-test
        run: python tests/test_basic.py

name: selftest

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.9", "3.12" ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependency (openpyxl only)
        # 不安装 pymiere：CI 里没有 Premiere，基础自测本就不依赖它
        run: python -m pip install --upgrade pip openpyxl

      - name: Reject Adobe proprietary files
        shell: bash
        run: |
          set -e

          # 按【被跟踪的文件名】判定，而不是扫描文件内容。
          #
          # 为什么不扫内容：本仓库的文档、注释、.gitignore、自测里都会
          # 正当地提到 "CSInterface.js"（说明它已被移除、如何拦截它）。
          # 任何基于字符串的扫描都会命中这些自指文本 —— 本项目第一次
          # 上线时就因此全矩阵误报。
          # 而真正要防的是「这个文件被提交进来」，按文件名判断既精确又无误报。
          bad=$(git ls-files | grep -Ei '(^|/)CSInterface\.js$|\.zxp$' || true)

          if [ -n "$bad" ]; then
            echo "::error::Adobe proprietary file must not be versioned:"
            echo "$bad"
            exit 1
          fi

          echo "OK: no Adobe proprietary files are tracked"

      - name: Run self-test
        run: python tests/test_basic.py
